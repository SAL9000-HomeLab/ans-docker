---
# Example inventory: placeholder host names only. The real inventory lives in AWX
# (or a gitignored local/ copy). Keep the group names; the roles key off them.
#
#   docker_swarm_managers  control plane; use an odd count (3 tolerates 1 failure, 5 tolerates 2)
#   docker_swarm_workers   run workloads only
#   docker_swarm_remove    hosts to take out of the swarm; they may stay listed in their old group
#
# Moving a host between managers and workers promotes/demotes it on the next run.
all:
  children:
    docker_swarm:
      children:
        docker_swarm_managers:
          hosts:
            swarm-mgr-01.lab.example.com:
              # Arcane keeps its data on this node (see arcane_placement_constraints).
              docker_swarm_node_labels:
                arcane: "true"
            swarm-mgr-02.lab.example.com:
            swarm-mgr-03.lab.example.com:
        docker_swarm_workers:
          hosts:
            swarm-wrk-01.lab.example.com:
            swarm-wrk-02.lab.example.com:
        docker_swarm_remove:
          hosts: {}
